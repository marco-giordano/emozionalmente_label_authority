# Label authority in SER: intended and perceived ground truth in Emozionalmente.
# Single configuration file for the whole study. Paths are relative to the
# repository root unless absolute.

paths:
  dataset_root: data/emozionalmente      # contains audio/ and metadata/{samples,evaluations}.csv
  features_dir: features                 # one HDF5 file per backbone
  results_dir: results                   # labels, probe results, predictions, analysis

# Seven classes, 0-indexed. On a tied listener plurality the lowest index wins.
classes: [disgust, joy, fear, anger, surprise, sadness, neutrality]

backbones:
  xlsr_300m:
    name: facebook/wav2vec2-xls-r-300m
    display_name: XLS-R 300M
  hubert_large_ll60k:
    name: facebook/hubert-large-ll60k
    display_name: HuBERT Large
  wavlm_large:
    name: microsoft/wavlm-large
    display_name: WavLM Large

# 25 hidden states per backbone (0 = convolutional front end, 1-24 = Transformer).
# Single-layer probes read these ten depths (0, 20, 33, ..., 100 % of the stack).
n_states: 25
layers: [0, 5, 8, 10, 13, 15, 18, 21, 22, 24]

probes: [linear, dense, agg_dense]

# The three label authorities. Hard targets train with cross-entropy and keep the
# checkpoint with the best validation accuracy; the soft target trains with soft
# cross-entropy against the unsmoothed five-vote histogram, keeps the checkpoint
# with the lowest validation soft cross-entropy, and is scored against the
# recognized plurality wherever a hard reference is needed.
label_targets: [expressed, recognized_plurality, recognized_distribution]

split:
  fractions: [0.6, 0.2, 0.2]   # train / val / test sample targets, speaker-independent
  seed: 42

training:
  epochs: 30
  lr: 1.0e-3
  n_runs: 5
  batch_size: 256        # linear / dense
  agg_batch_size: 16     # agg_dense streams all 25 states from HDF5
  agg_num_workers: 4

analysis:
  bootstrap_iterations: 1000
  bootstrap_seed: 20260709
  min_good_votes: 3      # good-quality re-scoring keeps clips with at least this many good votes
  figure_dpi: 600
